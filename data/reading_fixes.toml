# Readings that depend on the words around

# 空にする, 空になる, 空です: empty, not the sky
[[word_reading]]
word = "空"
sudachi = "そら"
reading = "から"
next_word_in = ["に", "です", "で", "撃ち", ""]

# このカテゴリは現在空のようです
[[word_reading]]
key = "mco.template.select.none"
word = "空"
sudachi = "そら"
reading = "から"

# 何か, 何も, 何を, 何が (何ら stays なんら)
[[word_reading]]
word = "何"
sudachi = "なん"
reading = "なに"
next_word_in = ["か", "も", "を", "が"]

# 他のプレイヤー
[[word_reading]]
word = "他"
sudachi = "た"
reading = "ほか"
next_word_in = ["の"]

# その他の設定 stays そのた
[[word_reading]]
word = "他"
sudachi = "た"
reading = "た"
previous_word_in = ["その"]
next_word_in = ["の"]

# 2日目, 7日: Sudachi reads the counter of the date (ふつか); the digits stay digits
