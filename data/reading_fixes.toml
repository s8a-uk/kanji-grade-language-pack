# Fixes of the readings and the splitting that Sudachi gives. Read by src/kanji_grade_language_pack/reading_fixes.py,
# which describes every table. A fix that matches nothing any more stops the build (make annotate-readings).
# To check a fix: make show-string KEY=<key of ja_jp.json>

# Words read in a way the 常用漢字表 and its 付表 do not list (ateji, names): always written in kana
unsplit_words = [
  "欠片",
  "真似る",
  "可愛らしい",
  "松明",
  "火傷",
  "香港",
  "谷岡久美",
]

# Readings a kanji takes inside words that the 常用漢字表 does not list
[extra_kanji_readings]
"来" = ["き", "こ"]
"文" = ["も"]
"日" = ["に"]
"達" = ["たち"]
"応" = ["のう"]

