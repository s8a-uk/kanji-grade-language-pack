# Proposes updates of the pinned versions once a week. Minecraft, Fabric API, Fabric Loader and Loom are followed by
# hand (check-minecraft-versions.yml tells when they have something new); the icon font in versions.mk too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is taken a week after it is out, not on its first day (a compromised release is usually found by then)
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    # The build image, and the client test's image of every Java (game_client_test/docker/java<N>/)
    directories: [/, "/game_client_test/docker/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Python stays on the minor version of pyproject.toml (requires-python ==3.15.*); a new minor version is taken by
      # hand with make lock. This also keeps out its alpha, beta and rc images (3.16.0a1)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The image of each Java stays on its major version (docker/java25/ on 25): the Java a Minecraft version runs
      # on is fixed (java_version in minecraft_versions.toml), and a new one gets its own directory
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  # SudachiDict changes readings: build.yml lists, on the pull request, the strings that differ in each language
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The Gradle wrapper of the client test (the Fabric versions are in versions.mk and minecraft_versions.toml)
  - package-ecosystem: gradle
    directory: /game_client_test
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
